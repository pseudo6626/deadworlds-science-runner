[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deadworlds-science-runner"
version = "0.9.0"
description = "Free/local scientific compute runner for Deadworlds Module 15 job packages"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3",
  "xarray>=2025.1",
  "arviz>=1.1,<2",
  "arviz-stats>=0.7",
  "h5netcdf>=1.3",
  "h5py>=3.12",
]

[project.optional-dependencies]
pymc = ["pymc>=6,<7"]
dev = ["pytest>=8"]

[project.scripts]
deadworlds-compute = "deadworlds_compute.cli:main"

[tool.setuptools.packages.find]
include = ["deadworlds_compute*"]
