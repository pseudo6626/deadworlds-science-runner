name: Deadworlds one-shot compute submit retry hardening

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deadworlds-compute-submit-retry-hardening
  cancel-in-progress: false

jobs:
  patch-test-commit:
    name: Patch, regression-test, and commit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: PRODUCTION_CONSTRAINTS.txt

      - name: Verify clean checkout and apply audited patch
        shell: bash
        env:
          DEADWORLDS_PATCH_B64: ""
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          git diff --exit-code
          git diff --cached --exit-code
          python - <<'PY'
          import base64, os
          from pathlib import Path
          Path("/tmp/deadworlds_compute_retry_patch.py").write_bytes(
              base64.b64decode(os.environ["DEADWORLDS_PATCH_B64"])
          )
          PY
          python /tmp/deadworlds_compute_retry_patch.py
          rm -f /tmp/deadworlds_compute_retry_patch.py

      - name: Inspect and constrain patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "$(printf '%s\n' deadworlds_compute/transport.py tests/test_transport.py)"
          git diff -- deadworlds_compute/transport.py tests/test_transport.py

      - name: Install runner and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -c PRODUCTION_CONSTRAINTS.txt '.[dev]'

      - name: Run focused transport regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_transport.py

      - name: Run full runner regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests

      - name: Commit tested patch and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW=".github/workflows/deadworlds-compute-retry-hardening.yml"
          test -f "$WORKFLOW"
          rm "$WORKFLOW"

          git diff --check
          git config user.name "deadworlds-maintenance[bot]"
          git config user.email "91988331+pseudo6626@users.noreply.github.com"

          git add deadworlds_compute/transport.py tests/test_transport.py "$WORKFLOW"
          git commit -m "Harden idempotent compute result submission"
          git push origin HEAD:main
