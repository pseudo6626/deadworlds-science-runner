          TAUJzKe6jLeBzgh+j+WTK2IjggCqWJIpSBjhykSrUoRRNoZKBxkcfEewrrsEuMBlMHgKTPQDcH4wNgMpGewvsTgkkHEhrvsx
          FaiVodttklfjJ5//H8DbViCecgQA
          DEADWORLDS_EMBEDDED_REPOSITORY

          export DEADWORLDS_PAYLOAD_B64="$b64"
          export DEADWORLDS_STAGE="$stage"

          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, gzip, hashlib, json, os

          b64_path = Path(os.environ["DEADWORLDS_PAYLOAD_B64"])
          stage = Path(os.environ["DEADWORLDS_STAGE"]).resolve()
          blob = base64.b64decode("".join(b64_path.read_text(encoding="utf-8").split()))

          actual_gz = hashlib.sha256(blob).hexdigest()
          if actual_gz != os.environ["EXPECTED_GZIP_SHA256"]:
              raise SystemExit("embedded gzip SHA-256 mismatch")

          raw = gzip.decompress(blob)
          actual_json = hashlib.sha256(raw).hexdigest()
          if actual_json != os.environ["EXPECTED_JSON_SHA256"]:
              raise SystemExit("embedded JSON SHA-256 mismatch")

          files = json.loads(raw)
          stage.mkdir(parents=True, exist_ok=True)

          for rel, content in files.items():
              posix = PurePosixPath(rel)
              if posix.is_absolute() or ".." in posix.parts:
                  raise SystemExit(f"unsafe payload path: {rel}")
              if rel.startswith(".github/workflows/"):
                  raise SystemExit(f"payload attempted workflow write: {rel}")
              target = (stage / Path(*posix.parts)).resolve()
              if stage not in target.parents and target != stage:
                  raise SystemExit(f"payload escaped stage: {rel}")
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")

          manifest = stage / "GITHUB_REPO_MANIFEST_SHA256.txt"
          for line in manifest.read_text(encoding="utf-8").splitlines():
              sha, rel = line.split("  ", 1)
              p = stage / rel
              if hashlib.sha256(p.read_bytes()).hexdigest() != sha:
                  raise SystemExit(f"manifest mismatch: {rel}")

          print(f"Verified {len(files)} audited non-workflow files.")
          PY

      - name: Install audited non-workflow repository files
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/deadworlds-repo"

          # Preserve .git and all workflow files. Replace everything else.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$stage/." .

          git add --all

          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "::error::Bootstrap unexpectedly attempted a workflow-file change."
            git diff --cached --name-only
            exit 21
          fi

          if git diff --cached --quiet; then
            echo "Repository files are already bootstrapped."
            exit 0
          fi

          git config user.name "Deadworlds Bootstrap"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bootstrap Deadworlds science runner files"
          git push origin HEAD:main
          echo "Deadworlds repository bootstrap complete."

  compute:
    name: Execute immutable scientific compute job
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.client_payload.compute_job_id != '' &&
      github.event.client_payload.compute_job_id != null
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out audited runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: PRODUCTION_CONSTRAINTS.txt

      - name: Validate dispatch identity
        env:
          COMPUTE_JOB_ID: ${{ github.event.client_payload.compute_job_id }}
        run: |
          python - <<'PY'
          import os, re
          job = os.environ["COMPUTE_JOB_ID"]
          if not re.fullmatch(r"[0-9a-fA-F-]{36}", job):
              raise SystemExit("Invalid Deadworlds compute job id")
          print("Dispatch accepted for immutable job:", job)
          PY

      - name: Request GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=deadworlds-compute")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          echo "::add-mask::$token"
          printf '%s' "$token" > "$RUNNER_TEMP/deadworlds-oidc.jwt"
          chmod 600 "$RUNNER_TEMP/deadworlds-oidc.jwt"

      - name: Claim immutable Worker bundle
        env:
          COMPUTE_JOB_ID: ${{ github.event.client_payload.compute_job_id }}
          DEADWORLDS_FORGE_BASES: "https://deadworlds-forge-sandbox.pseudonymous-cypher.workers.dev;https://deadworlds-forge.pseudonymous-cypher.workers.dev"
        run: |
          python scripts/claim_bundle.py \
            --job-id "$COMPUTE_JOB_ID" \
            --oidc-file "$RUNNER_TEMP/deadworlds-oidc.jwt" \
            --out "$RUNNER_TEMP/WORKER_BUNDLE.json"

      - name: Inspect required backend
        id: backend
        env:
          BUNDLE: ${{ runner.temp }}/WORKER_BUNDLE.json
        run: |
          python - <<'PY'
          import json, os
          p = json.load(open(os.environ["BUNDLE"], encoding="utf-8"))
          plugin = p["package"]["manifest"]["model"]["plugin"]
          is_pymc = plugin.startswith("pymc_")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"plugin={plugin}\n")
              fh.write(f"is_pymc={'true' if is_pymc else 'false'}\n")
          print("Compute plugin:", plugin)
          PY

      - name: Install validated runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [[ "${{ steps.backend.outputs.is_pymc }}" == "true" ]]; then
            python -m pip install -c PRODUCTION_CONSTRAINTS.txt '.[pymc]'
          else
            python -m pip install -c PRODUCTION_CONSTRAINTS.txt .
          fi

      - name: Validate PyMC runtime
        if: steps.backend.outputs.is_pymc == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from importlib.metadata import version
          expected = {"numpy": "2.1.3", "pymc": "6.3.2", "pytensor": "3.3.4", "arviz": "1.1.0", "arviz-stats": "1.1.0", "xarray": "2025.12.0", "h5netcdf": "1.8.1", "h5py": "3.14.0"}
          for package, wanted in expected.items():
              actual = version(package)
              if actual != wanted:
                  raise SystemExit(f"{package}: expected {wanted}, got {actual}")
          import pymc, pytensor, arviz, numpy, xarray, h5netcdf, h5py
          print("Validated pinned PyMC runtime.")
          PY

      - name: Execute, upload to Drive, and submit to Forge
        env:
          BUNDLE: ${{ runner.temp }}/WORKER_BUNDLE.json
          OUTDIR: ${{ runner.temp }}/deadworlds-output
          RESULT_LOG: ${{ runner.temp }}/deadworlds-result.json
        shell: bash
        run: |
          set -euo pipefail
          deadworlds-compute run "$BUNDLE" --out "$OUTDIR" | tee "$RESULT_LOG"

      - name: Write run summary
        if: success()
        env:
          COMPUTE_JOB_ID: ${{ github.event.client_payload.compute_job_id }}
          PLUGIN: ${{ steps.backend.outputs.plugin }}
        run: |
          {
            echo "## Deadworlds scientific compute"
            echo
            echo "- Job: \`$COMPUTE_JOB_ID\`"
            echo "- Plugin: \`$PLUGIN\`"
            echo "- Status: **submitted to Forge**"
            echo "- Full posterior/draw artifact: Google Drive via the private compute-storage broker"
            echo
            echo "This run is an inference execution record. It does not establish model truth."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy ephemeral capabilities
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f "$RUNNER_TEMP/WORKER_BUNDLE.json" ]]; then
            shred -u "$RUNNER_TEMP/WORKER_BUNDLE.json" 2>/dev/null || rm -f "$RUNNER_TEMP/WORKER_BUNDLE.json"
          fi
          if [[ -f "$RUNNER_TEMP/deadworlds-oidc.jwt" ]]; then
            shred -u "$RUNNER_TEMP/deadworlds-oidc.jwt" 2>/dev/null || rm -f "$RUNNER_TEMP/deadworlds-oidc.jwt"
          fi
