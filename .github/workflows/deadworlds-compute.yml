# Deadworlds permanent compute workflow + one-time repository bootstrap
#
# Create this file manually at:
#   .github/workflows/deadworlds-compute.yml
#
# First push: reconstructs all audited NON-workflow repository files.
# Later: handles Cloudflare repository_dispatch compute jobs.
#
# It never creates, edits, or deletes a workflow file with GITHUB_TOKEN.

name: Deadworlds scientific compute

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deadworlds-compute.yml"
  repository_dispatch:
    types: [deadworlds-compute-v1]

concurrency:
  group: deadworlds-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.compute_job_id || 'bootstrap' }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap audited repository files
    if: github.event_name == 'push' && github.repository == 'pseudo6626/deadworlds-science-runner'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Refuse unexpected pre-existing files
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(
            git ls-files \
              | grep -Fvx ".github/workflows/deadworlds-compute.yml" \
              | grep -Fvx ".github/workflows/bootstrap-deadworlds.yml" \
              | grep -Fvx "README.md" \
              || true
          )"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Refusing to bootstrap over unexpected tracked files:"
            printf '%s\n' "$unexpected"
            exit 20
          fi

      - name: Materialize and verify audited repository payload
        shell: bash
        env:
          EXPECTED_GZIP_SHA256: "05147af68d2d6cc029e978b2615ec6083ca34c5b8d293d49d8a63845880c5f91"
          EXPECTED_JSON_SHA256: "367c74db29534a3bbb7d452bfe76ae24cab1cac9e7ec50f746b44027a7c2b29c"
