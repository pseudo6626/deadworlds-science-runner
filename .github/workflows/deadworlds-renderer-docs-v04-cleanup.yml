name: Deadworlds one-shot renderer docs v0.4 cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deadworlds-renderer-docs-v04-cleanup
  cancel-in-progress: false

jobs:
  update-test-commit:
    name: Update docs, verify registry, test, and commit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: figure_renderer/RENDERER_CONSTRAINTS.txt

      - name: Verify audited starting state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          git diff --exit-code
          git diff --cached --exit-code
          python - <<'PY'
          from pathlib import Path
          readme = Path("figure_renderer/README.md").read_text(encoding="utf-8")
          constraints = Path("figure_renderer/RENDERER_CONSTRAINTS.txt").read_text(encoding="utf-8")
          pyproject = Path("figure_renderer/pyproject.toml").read_text(encoding="utf-8")
          if not readme.startswith("# Deadworlds Figure Renderer v0.2.0"):
              raise SystemExit("README starting state no longer matches the audited stale v0.2 document.")
          if not constraints.startswith("# Exact stack used for Deadworlds Figure Renderer v0.2.0 validation"):
              raise SystemExit("Constraints comment no longer matches the audited stale v0.2 comment.")
          if 'version = "0.4.0"' not in pyproject:
              raise SystemExit("Renderer package is not v0.4.0; refusing documentation-only patch.")
          print("Starting state matches audited documentation gap.")
          PY

      - name: Write current v0.4 renderer documentation
        shell: bash
        run: |
          set -euo pipefail
          cat > figure_renderer/README.md <<'EOF'
          # Deadworlds Figure Renderer v0.4.0

          Deterministic static scientific renderer for the Deadworlds `deadworlds-figure-spec-v1` contract.

          The renderer does not invent numeric plot data. Numeric values come only from `FigureSpec.data.bindings`. Provenance, assumptions, unresolved quantities, and epistemic limits remain explicit in the render manifest and, where appropriate, on the detached static figure itself.

          ## Hosted recipe coverage

          Renderer v0.4.0 currently supports 17 hosted recipes across Modules 1, 2, 10, 12, and 15.

          ### Module 1 — Atmospheric Evolution

          - `m01_equilibrium_temperature_albedo_sensitivity`
          - `m01_escape_retention_sensitivity`
          - `m01_multistar_forcing_contributors`

          These adapters preserve the distinction between deterministic sensitivity calculations and inferred atmospheric history. They do not infer greenhouse warming, exobase structure, escape rate, atmospheric-loss history, or unresolved stellar forcing.

          ### Module 2 — Geochemical Cycling

          - `m02_atmospheric_element_budget`
          - `m02_redox_ratio_diagnostics`
          - `m02_rock_metal_ice_composition`

          These adapters remain deliberately conservative. They do not convert broad DSS composition into mineralogy, measured atmospheric gas ratios into mantle oxygen fugacity, or incomplete atmospheric measurements into whole-planet inventories or aqueous pH.

          ### Module 10 — Technological Energetics

          - `m10_energy_lower_bound_ledger`
          - `m10_energy_power_identifiability`
          - `m10_process_trace_prerequisite_matrix`
          - `m10_radiative_ceiling_vs_capture`
          - `m10_measurement_formula_provenance`

          ### Module 12 — Cultural Transmission

          - `m12a_trait_frequency_by_phase`
          - `m12a_diversity_distance_by_phase`
          - `m12a_transmission_model_identifiability`

          ### Module 15 — Model Comparison / PPC

          - `m15a_evaluation_method_eligibility`
          - `m15a_validation_diagnostics`
          - `m15a_adequacy_vs_preference_contract`

          Any recipe without a registered deterministic adapter fails closed with `UnsupportedRecipeError`. Contract presence alone is not treated as renderer support.

          ## Determinism and validation

          The validated renderer stack is pinned in `RENDERER_CONSTRAINTS.txt`:

          - Python 3.13 hosted runtime
          - Matplotlib 3.10.8
          - NumPy 2.3.5
          - jsonschema 4.26.0
          - pytest 9.0.2

          SVG hash salt and export metadata are fixed. Regression tests require repeat renders of the same FigureSpec to produce identical output hashes.

          Renderer v0.4.0 has also been validated through the hosted path: Worker-issued immutable FigureSpec package, repository/workflow-bound GitHub OIDC, deterministic render, private Google Drive upload and verification, and idempotent Forge result submission. Final submission uses bounded retry for transient network/server failures so a lost response after a successful idempotent POST does not unnecessarily fail the hosted render.

          ## Local use

          ```bash
          cd figure_renderer
          python -m pip install -c RENDERER_CONSTRAINTS.txt '.[dev]'
          deadworlds-render-figure examples/m10_energy_lower_bound_ledger.json --out rendered/
          ```

          Strict mode requires a persisted `module_run_id` and at least one `source_ref`.

          ## Hosted rendering protocol

          The package includes the runner-side claim and execution scripts used by the GitHub Actions rendering workflow. The hosted protocol uses:

          1. an immutable Worker-issued FigureSpec package;
          2. GitHub OIDC bound to the exact repository and workflow;
          3. separate one-job lease and submit capabilities;
          4. deterministic rendering on GitHub-hosted Python 3.13;
          5. a deterministic ZIP render bundle;
          6. resumable upload to Google Drive through a private render-storage Worker;
          7. Drive SHA-256, size, MIME, and app-property verification;
          8. bounded retry of the final idempotent Forge result submission.

          No Google credential or long-lived render capability is sent to GitHub.
          EOF

          cat > figure_renderer/RENDERER_CONSTRAINTS.txt <<'EOF'
          # Exact stack used for Deadworlds Figure Renderer v0.4.0 validation, 2026-10-29
          matplotlib==3.10.8
          numpy==2.3.5
          jsonschema==4.26.0
          pytest==9.0.2
          EOF

      - name: Verify docs against live adapter registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast

          source = Path("figure_renderer/deadworlds_figures/adapters.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          registry = None
          for node in tree.body:
              if isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name) and node.target.id == "_ADAPTERS":
                  if not isinstance(node.value, ast.Dict):
                      raise SystemExit("_ADAPTERS is no longer a literal dictionary; review required.")
                  registry = {
                      key.value
                      for key in node.value.keys
                      if isinstance(key, ast.Constant) and isinstance(key.value, str)
                  }
                  break
          if registry is None:
              raise SystemExit("Could not locate live _ADAPTERS registry.")

          expected = {
              "m01_equilibrium_temperature_albedo_sensitivity",
              "m01_escape_retention_sensitivity",
              "m01_multistar_forcing_contributors",
              "m02_atmospheric_element_budget",
              "m02_redox_ratio_diagnostics",
              "m02_rock_metal_ice_composition",
              "m10_energy_lower_bound_ledger",
              "m10_energy_power_identifiability",
              "m10_process_trace_prerequisite_matrix",
              "m10_radiative_ceiling_vs_capture",
              "m10_measurement_formula_provenance",
              "m12a_trait_frequency_by_phase",
              "m12a_diversity_distance_by_phase",
              "m12a_transmission_model_identifiability",
              "m15a_evaluation_method_eligibility",
              "m15a_validation_diagnostics",
              "m15a_adequacy_vs_preference_contract",
          }

          if registry != expected:
              raise SystemExit(
                  "Live registry differs from audited 17-recipe set. "
                  f"Unexpected={sorted(registry - expected)} Missing={sorted(expected - registry)}"
              )

          readme = Path("figure_renderer/README.md").read_text(encoding="utf-8")
          for recipe in sorted(expected):
              if readme.count(f"`{recipe}`") != 1:
                  raise SystemExit(f"README recipe mismatch for {recipe}.")
          if "# Deadworlds Figure Renderer v0.4.0" not in readme:
              raise SystemExit("README version heading is not v0.4.0.")
          if "17 hosted recipes" not in readme:
              raise SystemExit("README does not state verified 17-recipe coverage.")
          if "UnsupportedRecipeError" not in readme or "fails closed" not in readme:
              raise SystemExit("README lost fail-closed contract.")

          constraints = Path("figure_renderer/RENDERER_CONSTRAINTS.txt").read_text(encoding="utf-8")
          required = [
              "# Exact stack used for Deadworlds Figure Renderer v0.4.0 validation, 2026-10-29",
              "matplotlib==3.10.8",
              "numpy==2.3.5",
              "jsonschema==4.26.0",
              "pytest==9.0.2",
          ]
          for marker in required:
              if marker not in constraints:
                  raise SystemExit(f"Missing constraint marker: {marker}")

          print("Documentation matches live 17-recipe v0.4.0 registry.")
          PY

      - name: Inspect and constrain documentation patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          expected="$(printf '%s\n' figure_renderer/README.md figure_renderer/RENDERER_CONSTRAINTS.txt)"
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
          git diff -- figure_renderer/README.md figure_renderer/RENDERER_CONSTRAINTS.txt

      - name: Install pinned renderer test environment
        shell: bash
        working-directory: figure_renderer
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -c RENDERER_CONSTRAINTS.txt '.[dev]'

      - name: Run renderer regression suite
        shell: bash
        working-directory: figure_renderer
        run: |
          set -euo pipefail
          python -m pytest -q tests

      - name: Commit tested docs and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW=".github/workflows/deadworlds-renderer-docs-v04-cleanup.yml"
          test -f "$WORKFLOW"
          rm "$WORKFLOW"
          git diff --check
          git config user.name "deadworlds-maintenance[bot]"
          git config user.email "91988331+pseudo6626@users.noreply.github.com"
          git add figure_renderer/README.md figure_renderer/RENDERER_CONSTRAINTS.txt "$WORKFLOW"
          git commit -m "Document renderer v0.4 hosted coverage"
          git push origin HEAD:main
