name: Deadworlds renderer v0.6 Modules 4-6 batch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deadworlds-renderer-v06-m456-batch
  cancel-in-progress: false

jobs:
  batch:
    name: Build, test, and land renderer v0.6 M4-M6
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - name: Check out main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        ref: main
        fetch-depth: 2

    - name: Set up Python 3.13
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: figure_renderer/RENDERER_CONSTRAINTS.txt

    - name: Verify audited v0.5 baseline
      shell: bash
      run: |
        set -euo pipefail
        test "$(git branch --show-current)" = "main"
        git fetch origin main
        test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
        test ! -e figure_renderer/deadworlds_figures/adapters_04_06.py
        test ! -e figure_renderer/deadworlds_figures/validate_04_06.py
        grep -Fq '__version__ = "0.5.0"' figure_renderer/deadworlds_figures/__init__.py
        grep -Fq 'RENDERER_VERSION = "deadworlds-figure-renderer-v0.5.0"' figure_renderer/deadworlds_figures/schema.py
        grep -Fq 'version = "0.5.0"' figure_renderer/pyproject.toml
        grep -Fq 'EXPECTED_RENDERER = "deadworlds-figure-renderer-v0.5.0"' figure_renderer/scripts/run_render_bundle.py
        grep -Fq '"svg.hashsalt": "deadworlds-figure-renderer-v0.4.0"' figure_renderer/deadworlds_figures/styles.py
        grep -Fq 'm03_trophic_transfer_sensitivity' figure_renderer/deadworlds_figures/adapters.py
        if grep -Fq 'm04_gravity_jump_sensitivity' figure_renderer/deadworlds_figures/adapters.py; then
          echo "M4 renderer support already exists; refusing to apply batch twice." >&2
          exit 1
        fi
        grep -Fq 'deadworlds-figure-renderer": "0.5.0"' .github/workflows/deadworlds-render-figure.yml
        echo "Validated expected renderer v0.5 baseline."

    - name: Add M4-M6 renderer adapters, firewalls, and tests
      shell: bash
      env:
        ADAPTERS_B64: 
          
        VALIDATE_B64: 
          
        TESTS_B64: 
          
      run: |
        set -euo pipefail
        python - <<'PYCODE'
        import base64, gzip, os
        from pathlib import Path
        payloads = {
            Path("figure_renderer/deadworlds_figures/adapters_04_06.py"): os.environ["ADAPTERS_B64"],
            Path("figure_renderer/deadworlds_figures/validate_04_06.py"): os.environ["VALIDATE_B64"],
            Path("figure_renderer/tests/test_modules_04_06.py"): os.environ["TESTS_B64"],
        }
        for path, encoded in payloads.items():
            path.parent.mkdir(parents=True, exist_ok=True)
            path.write_bytes(gzip.decompress(base64.b64decode(encoded)))
            print(f"wrote {path}")
        PYCODE

    - name: Patch renderer v0.6 release identity and registry
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PYCODE'
        from pathlib import Path

        def replace_exact(path, old, new, count=None):
            p = Path(path)
            text = p.read_text(encoding="utf-8")
            found = text.count(old)
            if found == 0:
                raise SystemExit(f"{path}: baseline text not found: {old!r}")
            if count is not None and found != count:
                raise SystemExit(f"{path}: expected {count} matches for {old!r}, got {found}")
            p.write_text(text.replace(old, new), encoding="utf-8")
            print(f"patched {path}: {found} replacement(s)")

        replace_exact("figure_renderer/deadworlds_figures/__init__.py", '__version__ = "0.5.0"', '__version__ = "0.6.0"', 1)
        replace_exact("figure_renderer/pyproject.toml", 'version = "0.5.0"', 'version = "0.6.0"', 1)
        replace_exact("figure_renderer/deadworlds_figures/schema.py", 'RENDERER_VERSION = "deadworlds-figure-renderer-v0.5.0"', 'RENDERER_VERSION = "deadworlds-figure-renderer-v0.6.0"', 1)
        replace_exact("figure_renderer/scripts/run_render_bundle.py", 'EXPECTED_RENDERER = "deadworlds-figure-renderer-v0.5.0"', 'EXPECTED_RENDERER = "deadworlds-figure-renderer-v0.6.0"', 1)
        replace_exact("figure_renderer/deadworlds_figures/styles.py", '"svg.hashsalt": "deadworlds-figure-renderer-v0.4.0"', '"svg.hashsalt": "deadworlds-figure-renderer-v0.6.0"', 1)
        replace_exact("figure_renderer/RENDERER_CONSTRAINTS.txt", 'Deadworlds Figure Renderer v0.5.0', 'Deadworlds Figure Renderer v0.6.0', 1)

        p = Path("figure_renderer/deadworlds_figures/adapters.py")
        text = p.read_text(encoding="utf-8")
        import_anchor = "from .plans import LineSeries, PlotPlan\n"
        if import_anchor not in text or "ADAPTERS_04_06" in text:
            raise SystemExit("adapters.py import baseline mismatch")
        text = text.replace(import_anchor, import_anchor + "from .adapters_04_06 import ADAPTERS_04_06\n", 1)
        marker = "\n\ndef plans_for_spec(spec: dict[str, Any]) -> list[PlotPlan]:"
        pos = text.find(marker)
        if pos < 0:
            raise SystemExit("adapters.py registry marker missing")
        text = text[:pos] + "\n_ADAPTERS.update(ADAPTERS_04_06)\n" + text[pos:]
        text = text.replace("recipe not implemented in renderer v0.5.0", "recipe not implemented in renderer v0.6.0", 1)
        p.write_text(text, encoding="utf-8")

        p = Path("figure_renderer/deadworlds_figures/validate.py")
        text = p.read_text(encoding="utf-8")
        anchor = "from .schema import FIGURE_SPEC_SCHEMA\n"
        if anchor not in text or "validate_module_04_06" in text:
            raise SystemExit("validate.py import baseline mismatch")
        text = text.replace(anchor, anchor + "from .validate_04_06 import validate_module_04_06\n", 1)
        text = text.replace('renderer v0.5.0 accepts only 2d FigureSpecs', 'renderer v0.6.0 accepts only 2d FigureSpecs', 1)
        marker = "    _finite_numbers(bindings)\n    return spec\n"
        if marker not in text:
            raise SystemExit("validate.py terminal validation marker missing")
        text = text.replace(marker, "    validate_module_04_06(spec)\n    _finite_numbers(bindings)\n    return spec\n", 1)
        p.write_text(text, encoding="utf-8")

        p = Path("figure_renderer/tests/test_renderer.py")
        text = p.read_text(encoding="utf-8")
        if 'assert package_version == "0.5.0"' not in text:
            raise SystemExit("test_renderer version baseline missing")
        text = text.replace('assert package_version == "0.5.0"', 'assert package_version == "0.6.0"', 1)
        recipe_anchor = '        "m10_energy_lower_bound_ledger",\n'
        if recipe_anchor not in text or '"m04_gravity_jump_sensitivity"' in text:
            raise SystemExit("test_renderer supported-recipe baseline mismatch")
        additions = '''        "m04_dynamic_pressure_grid",\n        "m04_froude_similarity_grid",\n        "m04_gravity_jump_sensitivity",\n        "m04_lift_loading_grid",\n        "m04_self_weight_support_scaling",\n        "m04_terminal_velocity_grid",\n        "m05_acoustic_sound_speed_sensitivity",\n        "m05_channel_identifiability",\n        "m05_diffraction_resolution_sensitivity",\n        "m05_stellar_emission_peak_context",\n        "m06_channel_identifiability_matrix",\n        "m06_multimodal_constraint_map",\n        "m06_sender_medium_receiver_prerequisites",\n        "m06_visual_angular_geometry_sensitivity",\n'''
        text = text.replace(recipe_anchor, additions + recipe_anchor, 1)
        p.write_text(text, encoding="utf-8")

        p = Path("figure_renderer/README.md")
        text = p.read_text(encoding="utf-8")
        if "# Deadworlds Figure Renderer v0.5.0" not in text:
            raise SystemExit("README v0.5 baseline missing")
        text = text.replace("# Deadworlds Figure Renderer v0.5.0", "# Deadworlds Figure Renderer v0.6.0", 1)
        text = text.replace(
            "Renderer v0.5.0 currently supports 20 hosted recipes across Modules 1, 2, 3, 10, 12, and 15.",
            "Renderer v0.6.0 currently supports 34 hosted recipes across Modules 1-6, 10, 12, and 15.",
            1,
        )
        module10 = "### Module 10 — Technological Energetics\n"
        if module10 not in text or "### Module 4 — Biomechanics Scaling" in text:
            raise SystemExit("README Module 10 insertion baseline mismatch")
        sections = '''### Module 4 — Biomechanics Scaling\n\n- `m04_gravity_jump_sensitivity`\n- `m04_froude_similarity_grid`\n- `m04_dynamic_pressure_grid`\n- `m04_terminal_velocity_grid`\n- `m04_lift_loading_grid`\n- `m04_self_weight_support_scaling`\n\nModule 4 renders explicit mechanics sensitivity grids only. Present-atmosphere aerodynamic calculations remain labeled `PRESENT_STATE_ONLY` and are never substituted for the unresolved biosphere-era medium. Launch speed, organism scale, gait transitions, ballistic coefficient, flight feasibility, wing loading, material strength, failure size, and locomotor power are not inferred.\n\n### Module 5 — Sensory Ecology\n\n- `m05_stellar_emission_peak_context`\n- `m05_acoustic_sound_speed_sensitivity`\n- `m05_diffraction_resolution_sensitivity`\n- `m05_channel_identifiability`\n\nModule 5 separates physical carrier context from evolved sensory biology. Wien-law stellar peaks are not surface spectra or receptor optima; present-medium sound-speed cases are not paleo acoustic active space; diffraction grids are not actual visual acuity. Carrier availability never becomes sensory prevalence or importance.\n\n### Module 6 — Non-acoustic Communication\n\n- `m06_channel_identifiability_matrix`\n- `m06_visual_angular_geometry_sensitivity`\n- `m06_sender_medium_receiver_prerequisites`\n- `m06_multimodal_constraint_map`\n\nModule 6 figures use only the public physical-carrier/prerequisite ledger. Hidden reconstructed sender or receiver biology is forbidden from FigureSpec bindings and public derived evidence. Sender and receiver prerequisites remain unresolved from public evidence; angular geometry does not become visibility or range, and the constraint map does not rank channels or infer evolved preference. Active magnetic signaling remains blocked by the v1 module policy.\n\n'''
        text = text.replace(module10, sections + module10, 1)
        p.write_text(text, encoding="utf-8")
        PYCODE

    - name: Install pinned renderer development stack
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        python -m pip install -c figure_renderer/RENDERER_CONSTRAINTS.txt -e './figure_renderer[dev]'

    - name: Verify release identity and recipe registry
      shell: bash
      run: |
        set -euo pipefail
        python -m py_compile \
          figure_renderer/deadworlds_figures/adapters_04_06.py \
          figure_renderer/deadworlds_figures/validate_04_06.py \
          figure_renderer/tests/test_modules_04_06.py
        python - <<'PYCODE'
        import sys
        sys.path.insert(0, "figure_renderer")
        from deadworlds_figures import __version__
        from deadworlds_figures.adapters import supported_recipes
        from deadworlds_figures.schema import RENDERER_VERSION
        assert __version__ == "0.6.0", __version__
        assert RENDERER_VERSION == "deadworlds-figure-renderer-v0.6.0", RENDERER_VERSION
        recipes = supported_recipes()
        assert len(recipes) == 34, len(recipes)
        for recipe in (
            "m04_gravity_jump_sensitivity", "m04_froude_similarity_grid", "m04_dynamic_pressure_grid",
            "m04_terminal_velocity_grid", "m04_lift_loading_grid", "m04_self_weight_support_scaling",
            "m05_stellar_emission_peak_context", "m05_acoustic_sound_speed_sensitivity",
            "m05_diffraction_resolution_sensitivity", "m05_channel_identifiability",
            "m06_channel_identifiability_matrix", "m06_visual_angular_geometry_sensitivity",
            "m06_sender_medium_receiver_prerequisites", "m06_multimodal_constraint_map",
        ):
            assert recipe in recipes, recipe
        print(f"Renderer {RENDERER_VERSION} exposes {len(recipes)} explicit recipes.")
        PYCODE
        grep -Fq '"svg.hashsalt": "deadworlds-figure-renderer-v0.6.0"' figure_renderer/deadworlds_figures/styles.py
        if grep -R -n -E 'deadworlds-figure-renderer-v0\.(4|5)\.0|Deadworlds Figure Renderer v0\.5\.0|version = "0\.5\.0"|__version__ = "0\.5\.0"' \
            figure_renderer/deadworlds_figures figure_renderer/scripts figure_renderer/pyproject.toml \
            figure_renderer/README.md figure_renderer/RENDERER_CONSTRAINTS.txt figure_renderer/tests \
            .github/workflows/deadworlds-render-figure.yml; then
          echo "Stale active renderer identity remains after v0.6 patch." >&2
          exit 1
        fi

    - name: Run focused Modules 4-6 renderer tests
      run: pytest -q figure_renderer/tests/test_modules_04_06.py

    - name: Run full renderer regression suite
      run: pytest -q figure_renderer/tests

    - name: Build and inspect v0.6 wheel
      shell: bash
      run: |
        set -euo pipefail
        rm -rf "$RUNNER_TEMP/deadworlds-v06-wheel"
        mkdir -p "$RUNNER_TEMP/deadworlds-v06-wheel"
        python -m pip wheel --no-deps ./figure_renderer -w "$RUNNER_TEMP/deadworlds-v06-wheel"
        wheel="$(find "$RUNNER_TEMP/deadworlds-v06-wheel" -maxdepth 1 -name 'deadworlds_figure_renderer-0.6.0-*.whl' -print -quit)"
        test -n "$wheel"
        python - "$wheel" <<'PYCODE'
        import hashlib, sys, zipfile
        path=sys.argv[1]
        raw=open(path,'rb').read()
        print("wheel_sha256="+hashlib.sha256(raw).hexdigest())
        with zipfile.ZipFile(path) as z:
            metadata=[n for n in z.namelist() if n.endswith('.dist-info/METADATA')]
            assert len(metadata)==1
            text=z.read(metadata[0]).decode()
            assert '\nVersion: 0.6.0\n' in text
            assert 'deadworlds_figures/adapters_04_06.py' in z.namelist()
            assert 'deadworlds_figures/validate_04_06.py' in z.namelist()
        print("Validated v0.6 wheel contents and metadata.")
        PYCODE

    - name: Guard against workflow-file mutation
      shell: bash
      run: "set -euo pipefail\nif ! git diff --quiet -- .github/workflows; then\n\
        \  echo \"Batch must not modify .github/workflows because the Actions token
        cannot push workflow-file changes.\" >&2\n  git diff -- .github/workflows
        >&2\n  exit 1\nfi\necho \"Confirmed batch changes are renderer code/docs/tests
        only.\"\n"
    - name: Commit and push the complete batch
      shell: bash
      run: |
        set -euo pipefail
        git diff --check
        git status --short
        git config user.name "Deadworlds batch workflow"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git diff --cached --quiet && { echo "No batch changes to commit." >&2; exit 1; }
        git commit -m "Add Modules 4-6 deterministic renderer [skip ci]"
        git push origin HEAD:main
        echo "Pushed renderer v0.6.0 M4-M6 code batch. Permanent workflow remains intentionally at v0.5.0 for one manual in-browser version edit."
