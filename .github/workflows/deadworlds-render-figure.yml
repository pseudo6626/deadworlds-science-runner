name: Deadworlds deterministic figure rendering

on:
  push:
    branches: [main]
    paths:
      - 'figure_renderer/**'
      - '.github/workflows/deadworlds-render-figure.yml'
  pull_request:
    paths:
      - 'figure_renderer/**'
      - '.github/workflows/deadworlds-render-figure.yml'
  repository_dispatch:
    types: [deadworlds-render-figure-v1]

jobs:
  renderer-regression:
    name: Bootstrap / validate deterministic renderer
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Materialize audited renderer package if absent
        id: bootstrap
        shell: bash
        env:
          RENDERER_PAYLOAD_B64: >-
            
        run: |
          set -euo pipefail
          if [[ -f figure_renderer/pyproject.toml ]]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Renderer package already present; bootstrap is a no-op."
            exit 0
          fi
          python - <<'PYBOOT'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          raw = gzip.decompress(base64.b64decode(os.environ["RENDERER_PAYLOAD_B64"]))
          expected = "fdae2d6a0375fc6832539402d80b68e449c8a2c3347cfd0f7ff32fdf63dc2cc5"
          got = hashlib.sha256(raw).hexdigest()
          if got != expected:
              raise SystemExit(f"Renderer bootstrap payload SHA mismatch: {got}")
          files = json.loads(raw)
          selected = {k: v for k, v in files.items() if k.startswith("figure_renderer/")}
          if len(selected) != 26:
              raise SystemExit(f"Expected 26 renderer files, got {len(selected)}")
          for path, content in selected.items():
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding="utf-8", newline="\n")
          print(f"Materialized {len(selected)} audited renderer files.")
          PYBOOT
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: figure_renderer/RENDERER_CONSTRAINTS.txt

      - name: Install pinned renderer stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c figure_renderer/RENDERER_CONSTRAINTS.txt './figure_renderer[dev]'

      - name: Run renderer regression suite
        run: pytest -q figure_renderer/tests

      - name: Commit bootstrapped renderer package
        if: steps.bootstrap.outputs.created == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figure_renderer
          git diff --cached --quiet && exit 0
          git commit -m "Add deterministic Deadworlds figure renderer v0.2.0"
          git push origin HEAD:main

  render:
    name: Render immutable scientific FigureSpec
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.client_payload.render_job_id != '' &&
      github.event.client_payload.render_job_id != null &&
      github.event.client_payload.forge_environment != '' &&
      github.event.client_payload.forge_environment != null
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deadworlds-render-${{ github.event.client_payload.render_job_id || 'invalid' }}
      cancel-in-progress: false
    steps:
      - name: Check out audited runners
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: figure_renderer/RENDERER_CONSTRAINTS.txt

      - name: Validate dispatch identity and route
        id: route
        env:
          RENDER_JOB_ID: ${{ github.event.client_payload.render_job_id }}
          FORGE_ENVIRONMENT: ${{ github.event.client_payload.forge_environment }}
        run: |
          python - <<'PY'
          import os, re
          job = os.environ["RENDER_JOB_ID"]
          environment = os.environ["FORGE_ENVIRONMENT"]
          if not re.fullmatch(r"[0-9a-fA-F-]{36}", job):
              raise SystemExit("Invalid Deadworlds render job id")
          forge_bases = {
              "sandbox": "https://deadworlds-forge-sandbox.pseudonymous-cypher.workers.dev",
              "production": "https://deadworlds-forge.pseudonymous-cypher.workers.dev",
          }
          if environment not in forge_bases:
              raise SystemExit("forge_environment must be exactly sandbox or production")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"forge_environment={environment}\n")
              fh.write(f"forge_base={forge_bases[environment]}\n")
          print(f"Render dispatch accepted for immutable job {job} in {environment}.")
          PY

      - name: Request GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=deadworlds-render")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          echo "::add-mask::$token"
          printf '%s' "$token" > "$RUNNER_TEMP/deadworlds-render-oidc.jwt"
          chmod 600 "$RUNNER_TEMP/deadworlds-render-oidc.jwt"

      - name: Claim immutable FigureSpec bundle
        env:
          RENDER_JOB_ID: ${{ github.event.client_payload.render_job_id }}
          DEADWORLDS_FORGE_BASE: ${{ steps.route.outputs.forge_base }}
        run: |
          python figure_renderer/scripts/claim_render_bundle.py \
            --job-id "$RENDER_JOB_ID" \
            --oidc-file "$RUNNER_TEMP/deadworlds-render-oidc.jwt" \
            --forge-base "$DEADWORLDS_FORGE_BASE" \
            --out "$RUNNER_TEMP/RENDER_BUNDLE.json"

      - name: Install pinned renderer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -c figure_renderer/RENDERER_CONSTRAINTS.txt ./figure_renderer

      - name: Validate renderer runtime
        shell: bash
        run: |
          python - <<'PY'
          from importlib.metadata import version
          expected = {
              "deadworlds-figure-renderer": "0.2.0",
              "matplotlib": "3.10.8",
              "numpy": "2.3.5",
              "jsonschema": "4.26.0",
          }
          for package, wanted in expected.items():
              actual = version(package)
              if actual != wanted:
                  raise SystemExit(f"{package}: expected {wanted}, got {actual}")
          print("Validated pinned Deadworlds renderer runtime.")
          PY

      - name: Render, upload to Drive, and submit to Forge
        env:
          BUNDLE: ${{ runner.temp }}/RENDER_BUNDLE.json
          OUTDIR: ${{ runner.temp }}/deadworlds-render-output
        shell: bash
        run: |
          set -euo pipefail
          python figure_renderer/scripts/run_render_bundle.py "$BUNDLE" --out "$OUTDIR"

      - name: Write run summary
        if: success()
        env:
          RENDER_JOB_ID: ${{ github.event.client_payload.render_job_id }}
          FORGE_ENVIRONMENT: ${{ steps.route.outputs.forge_environment }}
        run: |
          {
            echo "## Deadworlds deterministic scientific rendering"
            echo
            echo "- Render job: \`$RENDER_JOB_ID\`"
            echo "- Forge environment: \`$FORGE_ENVIRONMENT\`"
            echo "- Renderer: \`deadworlds-figure-renderer-v0.2.0\`"
            echo "- Status: **verified render bundle submitted to Forge**"
            echo
            echo "Numeric plotting data came only from the immutable FigureSpec bindings."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy ephemeral capabilities
        if: always()
        shell: bash
        run: |
          set +e
          for f in "$RUNNER_TEMP/RENDER_BUNDLE.json" "$RUNNER_TEMP/deadworlds-render-oidc.jwt"; do
            if [[ -f "$f" ]]; then
              shred -u "$f" 2>/dev/null || rm -f "$f"
            fi
          done
