name: Deadworlds renderer v0.8 public M7-M8 code-only batch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify v0.7 baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path("figure_renderer/pyproject.toml").read_text(encoding="utf-8")
          m = re.search(r'^version = "([^"]+)"$', text, re.M)
          if not m or m.group(1) != "0.7.0":
              raise SystemExit(f"Expected renderer baseline 0.7.0, got {m.group(1) if m else 'missing'}")
          if Path("figure_renderer/deadworlds_figures/adapters_07_08.py").exists():
              raise SystemExit("v0.8 adapter already exists; refusing ambiguous re-run")
          if Path("figure_renderer/deadworlds_figures/validate_07_08.py").exists():
              raise SystemExit("v0.8 validator already exists; refusing ambiguous re-run")
          PY

      - name: Add public-evidence M7-M8 renderer extension
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path

          files = {
              'figure_renderer/deadworlds_figures/adapters_07_08.py': '',
              'figure_renderer/deadworlds_figures/validate_07_08.py': '',
              'figure_renderer/tests/test_modules_07_08.py': '',
          }
          for name, payload in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(payload))
              print("wrote", name)
          PY

      - name: Register v0.8 adapters validators and identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, got {n}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "figure_renderer/deadworlds_figures/adapters.py",
              "from .adapters_09_11_13_14 import ADAPTERS_09_11_13_14\n",
              "from .adapters_09_11_13_14 import ADAPTERS_09_11_13_14\nfrom .adapters_07_08 import ADAPTERS_07_08\n",
          )
          replace_once(
              "figure_renderer/deadworlds_figures/adapters.py",
              "_ADAPTERS.update(ADAPTERS_09_11_13_14)\n",
              "_ADAPTERS.update(ADAPTERS_09_11_13_14)\n_ADAPTERS.update(ADAPTERS_07_08)\n",
          )
          replace_once(
              "figure_renderer/deadworlds_figures/validate.py",
              "from .validate_09_11_13_14 import validate_module_09_11_13_14\n",
              "from .validate_09_11_13_14 import validate_module_09_11_13_14\nfrom .validate_07_08 import validate_module_07_08\n",
          )
          replace_once(
              "figure_renderer/deadworlds_figures/validate.py",
              "    validate_module_09_11_13_14(spec)\n    _finite_numbers(bindings)\n",
              "    validate_module_09_11_13_14(spec)\n    validate_module_07_08(spec)\n    _finite_numbers(bindings)\n",
          )
          replace_once(
              "figure_renderer/tests/test_renderer.py",
              '        "m06_visual_angular_geometry_sensitivity",\n        "m09_pairwise_distance_matrix",\n',
              '        "m06_visual_angular_geometry_sensitivity",\n'
              '        "m07_driver_trait_identifiability",\n'
              '        "m07_primary_secondary_dependency",\n'
              '        "m08_behavior_trace_license_matrix",\n'
              '        "m08_ethological_ambiguity_graph",\n'
              '        "m08_ichnological_inference_ladder",\n'
              '        "m08_preservation_gate_matrix",\n'
              '        "m09_pairwise_distance_matrix",\n',
          )

          # Renderer-internal identity migration only. Workflow files are intentionally untouched.
          changed = []
          for p in sorted(Path("figure_renderer").rglob("*")):
              if not p.is_file() or p.suffix.lower() in {".png", ".jpg", ".jpeg", ".gif", ".zip", ".whl", ".pyc"}:
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if "0.7.0" in text:
                  p.write_text(text.replace("0.7.0", "0.8.0"), encoding="utf-8")
                  changed.append(str(p))
          print("identity-updated files:")
          for p in changed:
              print(" ", p)
          if not changed:
              raise SystemExit("No renderer v0.7.0 identity strings were migrated")
          leftovers = []
          for p in Path("figure_renderer").rglob("*"):
              if p.is_file():
                  try:
                      if "0.7.0" in p.read_text(encoding="utf-8"):
                          leftovers.append(str(p))
                  except UnicodeDecodeError:
                      pass
          if leftovers:
              raise SystemExit(f"Renderer v0.7.0 identity strings remain: {leftovers}")
          PY

      - name: Install pinned v0.8 renderer stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -c figure_renderer/RENDERER_CONSTRAINTS.txt -e './figure_renderer[dev]'

      - name: Validate v0.8 runtime and exact recipe registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from importlib.metadata import version
          from deadworlds_figures import __version__
          from deadworlds_figures.adapters import supported_recipes
          from deadworlds_figures.schema import RENDERER_VERSION

          expected = {
              "deadworlds-figure-renderer": "0.8.0",
              "matplotlib": "3.10.8",
              "numpy": "2.3.5",
              "jsonschema": "4.26.0",
              "pytest": "9.0.2",
          }
          for package, wanted in expected.items():
              actual = version(package)
              if actual != wanted:
                  raise SystemExit(f"{package}: expected {wanted}, got {actual}")
          if __version__ != "0.8.0":
              raise SystemExit(f"package __version__ mismatch: {__version__}")
          if RENDERER_VERSION != "deadworlds-figure-renderer-v0.8.0":
              raise SystemExit(f"schema renderer mismatch: {RENDERER_VERSION}")

          recipes = set(supported_recipes())
          required = {
              "m07_driver_trait_identifiability",
              "m07_primary_secondary_dependency",
              "m08_behavior_trace_license_matrix",
              "m08_preservation_gate_matrix",
              "m08_ethological_ambiguity_graph",
              "m08_ichnological_inference_ladder",
          }
          blocked = {"m07_clade_constraint_matrix", "m07_lineage_continuity_status"}
          if len(recipes) != 55:
              raise SystemExit(f"expected exactly 55 supported recipes, got {len(recipes)}")
          if not required <= recipes:
              raise SystemExit(f"missing v0.8 recipes: {sorted(required-recipes)}")
          if recipes & blocked:
              raise SystemExit(f"unsafe M7 recipes became registered: {sorted(recipes&blocked)}")

          test_text = __import__("pathlib").Path("figure_renderer/tests/test_renderer.py").read_text(encoding="utf-8")
          for recipe in sorted(required):
              if f'"{recipe}"' not in test_text:
                  raise SystemExit(f"explicit supported-recipe regression list missing {recipe}")
          for recipe in sorted(blocked):
              # Blocked recipe names may appear elsewhere in tests, but must not be inserted
              # between the registered M6 and M9 sequence.
              pass

          print("Validated v0.8 runtime with exactly 55 recipes; unsafe M7 lineage/clade recipes remain blocked.")
          PY

      - name: Run focused M7-M8 public-firewall tests
        run: pytest -q figure_renderer/tests/test_modules_07_08.py

      - name: Run full renderer regression suite
        run: pytest -q figure_renderer/tests

      - name: Build and inspect v0.8 wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/deadworlds-v08-dist
          mkdir -p /tmp/deadworlds-v08-dist
          python -m build --wheel figure_renderer --outdir /tmp/deadworlds-v08-dist
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile

          wheels=list(Path("/tmp/deadworlds-v08-dist").glob("deadworlds_figure_renderer-0.8.0-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one v0.8 wheel, found {wheels}")
          wheel=wheels[0]
          digest=hashlib.sha256(wheel.read_bytes()).hexdigest()
          with zipfile.ZipFile(wheel) as z:
              names=set(z.namelist())
              required={
                  "deadworlds_figures/adapters_07_08.py",
                  "deadworlds_figures/validate_07_08.py",
              }
              missing=required-names
              if missing:
                  raise SystemExit(f"v0.8 wheel missing files: {sorted(missing)}")
          print(f"WHEEL={wheel.name}")
          print(f"SHA256={digest}")
          PY

      - name: Verify renderer-only diff
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          python - <<'PY'
          import subprocess
          from pathlib import Path

          required = [
              "figure_renderer/deadworlds_figures/adapters_07_08.py",
              "figure_renderer/deadworlds_figures/validate_07_08.py",
              "figure_renderer/tests/test_modules_07_08.py",
          ]
          missing=[p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit(f"missing v0.8 files: {missing}")

          rows=subprocess.check_output(["git","status","--short"], text=True).splitlines()
          bad=[]
          for row in rows:
              path=row[3:].strip()
              if not path.startswith("figure_renderer/"):
                  bad.append(path)
          if bad:
              raise SystemExit(f"non-renderer changes detected: {bad}")
          PY
          git diff --check

      - name: Commit and push v0.8 renderer code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "deadworlds-renderer-bot"
          git config user.email "deadworlds-renderer-bot@users.noreply.github.com"
          git add figure_renderer
          if git diff --cached --quiet; then
            echo "No renderer changes to commit." >&2
            exit 1
          fi
          git commit -m "Add public renderer v0.8 Modules 7 and 8 [skip ci]"
          git push origin HEAD:main
          echo "Pushed renderer v0.8 code only. Permanent renderer workflow remains on v0.7 until manually version-bumped."
