name: Deadworlds one-shot renderer v0.5 manifest identity fix
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: deadworlds-renderer-v05-manifest-identity-fix
  cancel-in-progress: false
jobs:
  fix-test-commit:
    name: Fix renderer manifest identity, test, and clean helper workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Check out main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: main
        fetch-depth: 0
    - name: Set up Python 3.13
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: figure_renderer/RENDERER_CONSTRAINTS.txt
    - name: Verify exact broken v0.5 starting state
      shell: bash
      run: "set -euo pipefail\ntest \"$(git branch --show-current)\" = \"main\"\ngit diff --exit-code\ngit diff --cached --exit-code\npython - <<'PY'\nfrom pathlib import Path\nexpected = {\n    \"figure_renderer/pyproject.toml\": 'version = \"0.5.0\"',\n    \"figure_renderer/deadworlds_figures/__init__.py\": '__version__ = \"0.5.0\"',\n    \"figure_renderer/scripts/run_render_bundle.py\": 'EXPECTED_RENDERER = \"deadworlds-figure-renderer-v0.5.0\"',\n    \"figure_renderer/deadworlds_figures/schema.py\": 'RENDERER_VERSION = \"deadworlds-figure-renderer-v0.4.0\"',\n}\nfor path, marker in expected.items():\n    text = Path(path).read_text(encoding=\"utf-8\")\n    if marker not in text:\n        raise SystemExit(f\"Unexpected starting state in {path}; missing {marker!r}\")\nhelper = Path(\".github/workflows/deadworlds-module3-renderer-v05-fixed.yml\")\nif not helper.exists():\n    raise SystemExit(\"Expected leftover fixed Module 3 helper workflow is absent; review before patching.\")\nprint(\"Confirmed exact hosted-version mismatch and leftover helper workflow.\")\nPY"
    - name: Fix manifest renderer identity and add regression
      shell: bash
      run: "set -euo pipefail\npython - <<'PY'\nfrom pathlib import Path\n\nschema = Path(\"figure_renderer/deadworlds_figures/schema.py\")\ntext = schema.read_text(encoding=\"utf-8\")\nold = 'RENDERER_VERSION = \"deadworlds-figure-renderer-v0.4.0\"'\nnew = 'RENDERER_VERSION = \"deadworlds-figure-renderer-v0.5.0\"'\nif text.count(old) != 1:\n    raise SystemExit(f\"Expected exactly one stale schema renderer version, found {text.count(old)}\")\nschema.write_text(text.replace(old, new, 1), encoding=\"utf-8\")\n\ntests = Path(\"figure_renderer/tests/test_renderer.py\")\nt = tests.read_text(encoding=\"utf-8\")\nanchor = \"ROOT = Path(__file__).resolve().parents[1]\\n\"\nif t.count(anchor) != 1:\n    raise SystemExit(\"Could not find unique renderer test insertion anchor.\")\nregression = '''\ndef test_renderer_version_identity_is_consistent():\n    from deadworlds_figures import __version__ as package_version\n    from deadworlds_figures.schema import RENDERER_VERSION\n\n    expected = f\"deadworlds-figure-renderer-v{package_version}\"\n    assert package_version == \"0.5.0\"\n    assert RENDERER_VERSION == expected\n\n'''\nif \"def test_renderer_version_identity_is_consistent():\" in t:\n    raise SystemExit(\"Renderer version identity regression already exists.\")\nt = t.replace(anchor, anchor + \"\\n\" + regression, 1)\ntests.write_text(t, encoding=\"utf-8\")\nprint(\"Patched schema manifest identity and added regression.\")\nPY"
    - name: Verify narrow patch
      shell: bash
      run: "set -euo pipefail\ngit diff --check\npython - <<'PY'\nimport subprocess\nfrom pathlib import Path\nchanged = set(subprocess.check_output([\"git\",\"diff\",\"--name-only\"], text=True).splitlines())\nexpected = {\n    \"figure_renderer/deadworlds_figures/schema.py\",\n    \"figure_renderer/tests/test_renderer.py\",\n}\nif changed != expected:\n    raise SystemExit(f\"Unexpected pre-cleanup patch scope: {sorted(changed)}\")\nschema = Path(\"figure_renderer/deadworlds_figures/schema.py\").read_text(encoding=\"utf-8\")\nif 'RENDERER_VERSION = \"deadworlds-figure-renderer-v0.5.0\"' not in schema:\n    raise SystemExit(\"schema.py did not move to renderer v0.5.0\")\nif 'deadworlds-figure-renderer-v0.4.0' in schema:\n    raise SystemExit(\"stale v0.4 renderer identity remains in schema.py\")\nprint(\"Narrow renderer identity patch verified.\")\nPY"
    - name: Install pinned renderer environment
      shell: bash
      working-directory: figure_renderer
      run: 'set -euo pipefail

        python -m pip install --upgrade pip

        python -m pip install -c RENDERER_CONSTRAINTS.txt ''.[dev]'''
    - name: Run focused identity and Module 3 tests
      shell: bash
      working-directory: figure_renderer
      run: 'set -euo pipefail

        python -m pytest -q tests/test_renderer.py -k ''renderer_version_identity or module3'''
    - name: Run complete renderer regression suite
      shell: bash
      working-directory: figure_renderer
      run: 'set -euo pipefail

        python -m pytest -q tests'
    - name: Commit fix and remove temporary workflows
      shell: bash
      run: 'set -euo pipefail

        SELF=".github/workflows/deadworlds-renderer-v05-version-fix.yml"

        OLD_HELPER=".github/workflows/deadworlds-module3-renderer-v05-fixed.yml"

        test -f "$SELF"

        test -f "$OLD_HELPER"

        rm "$SELF" "$OLD_HELPER"

        git diff --check

        git config user.name "deadworlds-maintenance[bot]"

        git config user.email "91988331+pseudo6626@users.noreply.github.com"

        git add   figure_renderer/deadworlds_figures/schema.py   figure_renderer/tests/test_renderer.py   "$SELF"   "$OLD_HELPER"

        git commit -m "Fix renderer v0.5 manifest identity"

        git push origin HEAD:main'
