name: Deadworlds renderer v0.9 M12-M15 provenance code-only batch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify v0.8 baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path("figure_renderer/pyproject.toml").read_text(encoding="utf-8")
          m = re.search(r'^version = "([^"]+)"$', text, re.M)
          if not m or m.group(1) != "0.8.0":
              raise SystemExit(f"Expected renderer baseline 0.8.0, got {m.group(1) if m else 'missing'}")
          for path in [
              "figure_renderer/deadworlds_figures/adapters_12_15_provenance.py",
              "figure_renderer/deadworlds_figures/validate_12_15_provenance.py",
              "figure_renderer/tests/test_modules_12_15_provenance.py",
          ]:
              if Path(path).exists():
                  raise SystemExit(f"v0.9 file already exists; refusing ambiguous re-run: {path}")
          PY

      - name: Add M12-M15 provenance renderer extension
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path

          files = {
              'figure_renderer/deadworlds_figures/adapters_12_15_provenance.py': '',
              'figure_renderer/deadworlds_figures/validate_12_15_provenance.py': '',
              'figure_renderer/tests/test_modules_12_15_provenance.py': '',
          }
          for name, payload in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(payload))
              print("wrote", name)
          PY

      - name: Register v0.9 adapters validators registry and identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, got {n}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "figure_renderer/deadworlds_figures/adapters.py",
              "from .adapters_07_08 import ADAPTERS_07_08\n",
              "from .adapters_07_08 import ADAPTERS_07_08\nfrom .adapters_12_15_provenance import ADAPTERS_12_15_PROVENANCE\n",
          )
          replace_once(
              "figure_renderer/deadworlds_figures/adapters.py",
              "_ADAPTERS.update(ADAPTERS_07_08)\n",
              "_ADAPTERS.update(ADAPTERS_07_08)\n_ADAPTERS.update(ADAPTERS_12_15_PROVENANCE)\n",
          )
          replace_once(
              "figure_renderer/deadworlds_figures/validate.py",
              "from .validate_07_08 import validate_module_07_08\n",
              "from .validate_07_08 import validate_module_07_08\nfrom .validate_12_15_provenance import validate_module_12_15_provenance\n",
          )
          replace_once(
              "figure_renderer/deadworlds_figures/validate.py",
              "    validate_module_07_08(spec)\n    _finite_numbers(bindings)\n",
              "    validate_module_07_08(spec)\n    validate_module_12_15_provenance(spec)\n    _finite_numbers(bindings)\n",
          )

          replace_once(
              "figure_renderer/tests/test_renderer.py",
              '        "m12a_diversity_distance_by_phase",\n        "m12a_trait_frequency_by_phase",\n',
              '        "m12a_diversity_distance_by_phase",\n        "m12a_trait_coding_provenance",\n        "m12a_trait_frequency_by_phase",\n',
          )
          replace_once(
              "figure_renderer/tests/test_renderer.py",
              '        "m15a_evaluation_method_eligibility",\n        "m15a_validation_diagnostics",\n',
              '        "m15a_evaluation_method_eligibility",\n        "m15a_model_provenance",\n        "m15a_validation_diagnostics",\n',
          )

          changed = []
          for p in sorted(Path("figure_renderer").rglob("*")):
              if not p.is_file() or p.suffix.lower() in {".png", ".jpg", ".jpeg", ".gif", ".zip", ".whl", ".pyc"}:
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if "0.8.0" in text:
                  p.write_text(text.replace("0.8.0", "0.9.0"), encoding="utf-8")
                  changed.append(str(p))
          if not changed:
              raise SystemExit("No renderer v0.8.0 identity strings were migrated")
          leftovers = []
          for p in Path("figure_renderer").rglob("*"):
              if not p.is_file():
                  continue
              try:
                  if "0.8.0" in p.read_text(encoding="utf-8"):
                      leftovers.append(str(p))
              except UnicodeDecodeError:
                  pass
          if leftovers:
              raise SystemExit(f"Renderer v0.8.0 identity strings remain: {leftovers}")
          print("identity-updated files:")
          for path in changed:
              print(" ", path)
          PY

      - name: Install pinned v0.9 renderer stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -c figure_renderer/RENDERER_CONSTRAINTS.txt -e './figure_renderer[dev]'

      - name: Validate v0.9 runtime and exact 57-recipe registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path

          from deadworlds_figures import __version__
          from deadworlds_figures.adapters import supported_recipes
          from deadworlds_figures.schema import RENDERER_VERSION

          expected = {
              "deadworlds-figure-renderer": "0.9.0",
              "matplotlib": "3.10.8",
              "numpy": "2.3.5",
              "jsonschema": "4.26.0",
              "pytest": "9.0.2",
          }
          for package, wanted in expected.items():
              actual = version(package)
              if actual != wanted:
                  raise SystemExit(f"{package}: expected {wanted}, got {actual}")
          if __version__ != "0.9.0":
              raise SystemExit(f"package __version__ mismatch: {__version__}")
          if RENDERER_VERSION != "deadworlds-figure-renderer-v0.9.0":
              raise SystemExit(f"schema renderer mismatch: {RENDERER_VERSION}")

          recipes = set(supported_recipes())
          required = {
              "m12a_trait_coding_provenance",
              "m15a_model_provenance",
          }
          scientifically_blocked = {
              "m01_orbital_irradiation_geometry_3d",
              "m02_phase_space",
              "m03_spatial_productivity_map",
              "m07_clade_constraint_matrix",
              "m07_lineage_continuity_status",
              "m11a_settlement_proxy_by_phase",
          }
          if len(recipes) != 57:
              raise SystemExit(f"expected exactly 57 supported recipes, got {len(recipes)}")
          if not required <= recipes:
              raise SystemExit(f"missing v0.9 provenance recipes: {sorted(required-recipes)}")
          if recipes & scientifically_blocked:
              raise SystemExit(f"scientifically blocked recipes became registered: {sorted(recipes&scientifically_blocked)}")

          test_text = Path("figure_renderer/tests/test_renderer.py").read_text(encoding="utf-8")
          missing_explicit = sorted(r for r in required if f'"{r}"' not in test_text)
          if missing_explicit:
              raise SystemExit(f"explicit supported-recipe regression is stale: {missing_explicit}")
          print("Validated v0.9 runtime with exactly 57 recipes and six science-blocked recipes still unsupported.")
          PY

      - name: Run focused M12-M15 provenance firewall tests
        run: pytest -q figure_renderer/tests/test_modules_12_15_provenance.py

      - name: Run full renderer regression suite
        run: pytest -q figure_renderer/tests

      - name: Build and inspect v0.9 wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/deadworlds-v09-dist
          mkdir -p /tmp/deadworlds-v09-dist
          python -m build --wheel figure_renderer --outdir /tmp/deadworlds-v09-dist
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          wheels = list(Path("/tmp/deadworlds-v09-dist").glob("deadworlds_figure_renderer-0.9.0-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one v0.9 wheel, found {wheels}")
          wheel = wheels[0]
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          with zipfile.ZipFile(wheel) as z:
              names = set(z.namelist())
              required = {
                  "deadworlds_figures/adapters_12_15_provenance.py",
                  "deadworlds_figures/validate_12_15_provenance.py",
              }
              missing = required - names
              if missing:
                  raise SystemExit(f"v0.9 wheel missing files: {sorted(missing)}")
          print(f"WHEEL={wheel.name}")
          print(f"SHA256={digest}")
          PY

      - name: Verify renderer-only diff
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          python - <<'PY'
          import subprocess
          from pathlib import Path

          required = [
              "figure_renderer/deadworlds_figures/adapters_12_15_provenance.py",
              "figure_renderer/deadworlds_figures/validate_12_15_provenance.py",
              "figure_renderer/tests/test_modules_12_15_provenance.py",
          ]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit(f"missing v0.9 files: {missing}")

          rows = subprocess.check_output(["git", "status", "--short"], text=True).splitlines()
          bad = []
          for row in rows:
              path = row[3:].strip()
              if not path.startswith("figure_renderer/"):
                  bad.append(path)
          if bad:
              raise SystemExit(f"non-renderer changes detected: {bad}")
          PY
          git diff --check

      - name: Commit and push v0.9 renderer code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "deadworlds-renderer-bot"
          git config user.email "deadworlds-renderer-bot@users.noreply.github.com"
          git add figure_renderer
          if git diff --cached --quiet; then
            echo "No renderer changes to commit." >&2
            exit 1
          fi
          git commit -m "Add renderer v0.9 provenance tables for Modules 12 and 15 [skip ci]"
          git push origin HEAD:main
          echo "Pushed renderer v0.9 code only. Permanent renderer workflow remains on v0.8 until manually version-bumped."
