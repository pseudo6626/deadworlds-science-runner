name: Deadworlds renderer v0.7 M9-M11-M13-M14 batch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify v0.6 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(python - <<'PY'
          import re
          from pathlib import Path
          text=Path("figure_renderer/pyproject.toml").read_text()
          m=re.search(r'^version = "([^"]+)"$', text, re.M)
          print(m.group(1) if m else "")
          PY
          )" = "0.6.0"
          grep -Fq 'RENDERER_VERSION = "deadworlds-figure-renderer-v0.6.0"' figure_renderer/deadworlds_figures/schema.py
          test "$(grep -o '0\.6\.0' .github/workflows/deadworlds-render-figure.yml | wc -l)" -eq 3
          test ! -e figure_renderer/deadworlds_figures/adapters_09_11_13_14.py
          test ! -e figure_renderer/deadworlds_figures/validate_09_11_13_14.py

      - name: Add v0.7 adapter validator and focused tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path
          files = {
              'figure_renderer/deadworlds_figures/adapters_09_11_13_14.py': '',
              'figure_renderer/deadworlds_figures/validate_09_11_13_14.py': '',
              'figure_renderer/tests/test_modules_09_11_13_14.py': '',
          }
          for name, payload in files.items():
              p=Path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(payload))
              print(f"wrote {name} ({p.stat().st_size} bytes)")
          PY

      - name: Patch renderer v0.7 registry identity docs and permanent workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(encoding="utf-8")
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence of {old!r}, got {n}")
              p.write_text(text.replace(old,new,1), encoding="utf-8")

          # Registry.
          p=Path("figure_renderer/deadworlds_figures/adapters.py")
          text=p.read_text(encoding="utf-8")
          old="from .adapters_04_06 import ADAPTERS_04_06\n"
          if text.count(old)!=1: raise SystemExit("adapters.py import marker mismatch")
          text=text.replace(old, old+"from .adapters_09_11_13_14 import ADAPTERS_09_11_13_14\n",1)
          old2="_ADAPTERS.update(ADAPTERS_04_06)\n"
          if text.count(old2)!=1: raise SystemExit("adapters.py registry marker mismatch")
          text=text.replace(old2, old2+"_ADAPTERS.update(ADAPTERS_09_11_13_14)\n",1)
          text=text.replace("recipe not implemented in renderer v0.6.0:", "recipe not implemented in renderer v0.7.0:")
          p.write_text(text,encoding="utf-8")

          # Validation registry.
          p=Path("figure_renderer/deadworlds_figures/validate.py")
          text=p.read_text(encoding="utf-8")
          old="from .validate_04_06 import validate_module_04_06\n"
          if text.count(old)!=1: raise SystemExit("validate.py import marker mismatch")
          text=text.replace(old, old+"from .validate_09_11_13_14 import validate_module_09_11_13_14\n",1)
          old2="    validate_module_04_06(spec)\n    _finite_numbers(bindings)\n"
          if text.count(old2)!=1: raise SystemExit("validate.py call marker mismatch")
          text=text.replace(old2, "    validate_module_04_06(spec)\n    validate_module_09_11_13_14(spec)\n    _finite_numbers(bindings)\n",1)
          text=text.replace("renderer v0.6.0 accepts only 2d FigureSpecs", "renderer v0.7.0 accepts only 2d FigureSpecs")
          p.write_text(text,encoding="utf-8")

          replace_once("figure_renderer/deadworlds_figures/__init__.py", '__version__ = "0.6.0"', '__version__ = "0.7.0"')
          replace_once("figure_renderer/deadworlds_figures/schema.py", 'RENDERER_VERSION = "deadworlds-figure-renderer-v0.6.0"', 'RENDERER_VERSION = "deadworlds-figure-renderer-v0.7.0"')
          replace_once("figure_renderer/deadworlds_figures/styles.py", '"svg.hashsalt": "deadworlds-figure-renderer-v0.6.0"', '"svg.hashsalt": "deadworlds-figure-renderer-v0.7.0"')
          replace_once("figure_renderer/pyproject.toml", 'version = "0.6.0"', 'version = "0.7.0"')
          replace_once("figure_renderer/scripts/run_render_bundle.py", 'EXPECTED_RENDERER = "deadworlds-figure-renderer-v0.6.0"', 'EXPECTED_RENDERER = "deadworlds-figure-renderer-v0.7.0"')
          replace_once("figure_renderer/RENDERER_CONSTRAINTS.txt", "Deadworlds Figure Renderer v0.6.0 validation", "Deadworlds Figure Renderer v0.7.0 validation")
          replace_once("figure_renderer/tests/test_modules_04_06.py", 'assert manifest["renderer_version"] == "deadworlds-figure-renderer-v0.6.0"', 'assert manifest["renderer_version"] == "deadworlds-figure-renderer-v0.7.0"')

          # Existing regression assertions.
          p=Path("figure_renderer/tests/test_renderer.py")
          text=p.read_text(encoding="utf-8")
          if text.count('assert package_version == "0.6.0"')!=1: raise SystemExit("test_renderer version marker mismatch")
          text=text.replace('assert package_version == "0.6.0"', 'assert package_version == "0.7.0"',1)
          m06='        "m06_visual_angular_geometry_sensitivity",\n'
          m10='        "m10_energy_lower_bound_ledger",\n'
          m12='        "m12a_diversity_distance_by_phase",\n'
          m15='        "m15a_adequacy_vs_preference_contract",\n'
          for marker in (m06,m10,m12,m15):
              if text.count(marker)!=1: raise SystemExit(f"supported recipe marker mismatch: {marker}")
          text=text.replace(m06, m06 + '''        "m09_pairwise_distance_matrix",\n        "m09_recovered_site_map",\n        "m09_sampling_and_recovery_context",\n        "m09_spatial_inference_prerequisite_matrix",\n''',1)
          text=text.replace(m10, m10,1)
          # Insert M11 immediately before M12.
          text=text.replace(m12, '''        "m11a_demographic_inference_ladder",\n        "m11a_population_inference_prerequisites",\n        "m11a_proxy_concordance_matrix",\n''' + m12,1)
          # Insert M13/M14 immediately before M15.
          text=text.replace(m15, '''        "m13a_alternative_explanation_matrix",\n        "m13a_comparison_provenance",\n        "m13a_corpus_readiness",\n        "m13a_direction_identifiability",\n        "m14a_decipherment_prerequisite_ladder",\n        "m14a_mark_inventory",\n        "m14a_model_handoff",\n        "m14a_sequence_reading_order",\n''' + m15,1)
          p.write_text(text,encoding="utf-8")

          # README identity and coverage.
          p=Path("figure_renderer/README.md")
          text=p.read_text(encoding="utf-8")
          text=text.replace("# Deadworlds Figure Renderer v0.6.0","# Deadworlds Figure Renderer v0.7.0",1)
          text=text.replace("Renderer v0.6.0 currently supports 34 hosted recipes across Modules 1-6, 10, 12, and 15.",
                            "Renderer v0.7.0 currently supports 49 hosted recipes across Modules 1-6, 9-15 except Modules 7-8 and the blocked M11 settlement-posterior recipe.",1)
          insert='''\n### Module 9 — Spatial Archaeology\n\n- `m09_recovered_site_map`\n- `m09_pairwise_distance_matrix`\n- `m09_sampling_and_recovery_context`\n- `m09_spatial_inference_prerequisite_matrix`\n\nModule 9 renders recovered-site geometry, descriptive distances, survey context, and blocked-analysis prerequisites only. Single-point site markers never become routes or networks; recovered-site density never becomes ancient settlement density; local survey grids are never promoted to planetary coordinates.\n\n### Module 11 — Demography\n\n- `m11a_proxy_concordance_matrix`\n- `m11a_population_inference_prerequisites`\n- `m11a_demographic_inference_ladder`\n\nModule 11 keeps recovered proxies, relative trends, minimum-individual evidence, and calibrated population at distinct epistemic levels. Hosted figures expose readiness/status only and never convert a proxy directly into population. `m11a_settlement_proxy_by_phase` remains blocked until chronology and sampling uncertainty are actually propagated.\n\n### Module 13 — Language Contact\n\n- `m13a_corpus_readiness`\n- `m13a_alternative_explanation_matrix`\n- `m13a_direction_identifiability`\n- `m13a_comparison_provenance`\n\nModule 13 renders recovered-corpus readiness and later-model eligibility only. It does not emit borrowing/contact probabilities, donor-recipient assignments, contact edges, social networks, or preferred models.\n\n### Module 14 — Inscription Decipherment\n\n- `m14a_mark_inventory`\n- `m14a_sequence_reading_order`\n- `m14a_decipherment_prerequisite_ladder`\n- `m14a_model_handoff`\n\nModule 14 renders formal recovered mark structure and analysis prerequisites only. It never emits sign values, phonetic or semantic assignments, translations, script classifications, or model winners.\n\n'''
          marker="### Module 10 — Technological Energetics\n"
          if text.count(marker)!=1: raise SystemExit("README insertion marker mismatch")
          text=text.replace(marker,insert+marker,1)
          p.write_text(text,encoding="utf-8")

          # Permanent hosted workflow: exactly three runtime identity references.
          p=Path(".github/workflows/deadworlds-render-figure.yml")
          text=p.read_text(encoding="utf-8")
          n=text.count("0.6.0")
          if n != 3: raise SystemExit(f"permanent workflow expected exactly 3 v0.6.0 refs, got {n}")
          p.write_text(text.replace("0.6.0","0.7.0"),encoding="utf-8")
          PY

      - name: Install pinned renderer development stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -c figure_renderer/RENDERER_CONSTRAINTS.txt -e './figure_renderer[dev]'

      - name: Verify v0.7 identity and exact hosted recipe set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from importlib.metadata import version
          from deadworlds_figures import __version__
          from deadworlds_figures.adapters import supported_recipes
          from deadworlds_figures.schema import RENDERER_VERSION

          recipes=supported_recipes()
          assert __version__=="0.7.0", __version__
          assert version("deadworlds-figure-renderer")=="0.7.0"
          assert RENDERER_VERSION=="deadworlds-figure-renderer-v0.7.0"
          assert len(recipes)==49, len(recipes)
          required={
              "m09_recovered_site_map","m09_pairwise_distance_matrix","m09_sampling_and_recovery_context","m09_spatial_inference_prerequisite_matrix",
              "m11a_proxy_concordance_matrix","m11a_population_inference_prerequisites","m11a_demographic_inference_ladder",
              "m13a_corpus_readiness","m13a_alternative_explanation_matrix","m13a_direction_identifiability","m13a_comparison_provenance",
              "m14a_mark_inventory","m14a_sequence_reading_order","m14a_decipherment_prerequisite_ladder","m14a_model_handoff",
          }
          assert required <= set(recipes)
          assert "m11a_settlement_proxy_by_phase" not in recipes
          assert not any(r.startswith("m07") or r.startswith("m08") for r in recipes)
          print("Renderer v0.7 identity and 49-recipe hosted set verified.")
          PY
          if grep -R -n '0\.6\.0' figure_renderer; then
            echo "stale renderer v0.6 identity remains under figure_renderer" >&2
            exit 1
          fi
          test "$(grep -o '0\.7\.0' .github/workflows/deadworlds-render-figure.yml | wc -l)" -eq 3
          ! grep -q '0\.6\.0' .github/workflows/deadworlds-render-figure.yml

      - name: Run focused Modules 9 11 13 14 tests
        run: pytest -q figure_renderer/tests/test_modules_09_11_13_14.py

      - name: Run full renderer regression suite
        run: pytest -q figure_renderer/tests

      - name: Build and inspect v0.7 wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/deadworlds-wheelhouse"
          mkdir -p "$RUNNER_TEMP/deadworlds-wheelhouse"
          python -m pip wheel --no-deps ./figure_renderer -w "$RUNNER_TEMP/deadworlds-wheelhouse"
          python - "$RUNNER_TEMP/deadworlds-wheelhouse" <<'PY'
          import hashlib, pathlib, sys, zipfile
          root=pathlib.Path(sys.argv[1])
          wheels=list(root.glob("deadworlds_figure_renderer-0.7.0-*.whl"))
          if len(wheels)!=1:
              raise SystemExit(f"expected one v0.7.0 wheel, got {wheels}")
          wheel=wheels[0]
          with zipfile.ZipFile(wheel) as z:
              meta=[n for n in z.namelist() if n.endswith(".dist-info/METADATA")]
              if len(meta)!=1: raise SystemExit("wheel METADATA missing")
              text=z.read(meta[0]).decode()
              if "Version: 0.7.0" not in text: raise SystemExit("wheel version metadata mismatch")
          print(f"wheel={wheel.name} sha256={hashlib.sha256(wheel.read_bytes()).hexdigest()} bytes={wheel.stat().st_size}")
          PY

      - name: Remove stale recovery workflows and this one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f             .github/workflows/deadworlds-render-figure-v05-PERMANENT.yml             .github/workflows/deadworlds-render-v05-hosted-e2e-FINAL.yml             .github/workflows/deadworlds-render-v05-hosted-e2e-corrected.yml             .github/workflows/deadworlds-render-v05-hosted-e2e-refresh.yml             .github/workflows/deadworlds-renderer-v05-version-fix.yml             .github/workflows/deadworlds-renderer-v06-m456-batch-CORRECTED.yml             .github/workflows/deadworlds-renderer-v06-m456-batch-FRESH.yml             .github/workflows/deadworlds-renderer-v07-m9m11m13m14-batch.yml

      - name: Verify final diff is the intended atomic batch
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/deadworlds-render-figure.yml")
          if not workflow.is_file():
              raise SystemExit("permanent renderer workflow is missing")

          workflow_text = workflow.read_text(encoding="utf-8")
          v07_count = workflow_text.count("0.7.0")
          if v07_count != 3:
              raise SystemExit(f"permanent workflow expected exactly 3 v0.7.0 references, got {v07_count}")
          if "0.6.0" in workflow_text:
              raise SystemExit("permanent workflow still contains a v0.6.0 reference")

          required = [
              "figure_renderer/deadworlds_figures/adapters_09_11_13_14.py",
              "figure_renderer/deadworlds_figures/validate_09_11_13_14.py",
              "figure_renderer/tests/test_modules_09_11_13_14.py",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit(f"missing v0.7 files: {missing}")

          print("Final v0.7 identity/files check passed.")
          PY
          git diff --check

      - name: Commit and push v0.7 batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "deadworlds-renderer-bot"
          git config user.email "deadworlds-renderer-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit." >&2
            exit 1
          fi
          git commit -m "Add renderer v0.7 Modules 9 11 13 14 batch"
          git push origin HEAD:main
          echo "Pushed atomic renderer v0.7 batch, permanent workflow upgrade, and stale-workflow cleanup."
