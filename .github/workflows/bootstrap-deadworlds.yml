# Deadworlds one-file repository bootstrap
#
# PUT THIS FILE AT:
#   .github/workflows/bootstrap-deadworlds.yml
#
# Commit it directly to main. The push itself starts this workflow.
# It reconstructs the audited Deadworlds GitHub Actions repository,
# verifies every embedded file, commits the result, and deletes this
# bootstrap workflow from the finished repository.
#
# Expected repository: pseudo6626/deadworlds-science-runner
# Embedded payload SHA-256: b28dadacfcc4c06c31e31c4be72de11d541365d65680dd1e0478169aa85f34cf

name: Bootstrap Deadworlds science runner repository

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-deadworlds.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    name: Reconstruct audited repository
    if: github.repository == 'pseudo6626/deadworlds-science-runner'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Refuse to overwrite an unexpected repository
        shell: bash
        run: |
          set -euo pipefail
          expected=".github/workflows/bootstrap-deadworlds.yml"

          # Intended starting state: an otherwise-empty repository containing
          # only this bootstrap workflow.
          unexpected="$(git ls-files | grep -Fvx "$expected" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Refusing to bootstrap over unexpected tracked files:"
            printf '%s\n' "$unexpected"
            exit 20
          fi

      - name: Materialize and verify embedded repository
        shell: bash
        env:
          EXPECTED_ARCHIVE_SHA256: "b28dadacfcc4c06c31e31c4be72de11d541365d65680dd1e0478169aa85f34cf"
        run: |
          set -euo pipefail

          b64="$RUNNER_TEMP/deadworlds-repo.zip.b64"
          archive="$RUNNER_TEMP/deadworlds-repo.zip"
          stage="$RUNNER_TEMP/deadworlds-repo"

