          DEADWORLDS_EMBEDDED_REPOSITORY

          base64 --decode "$b64" > "$archive"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          if [[ "$actual" != "$EXPECTED_ARCHIVE_SHA256" ]]; then
            echo "::error::Embedded repository archive SHA-256 mismatch."
            echo "expected=$EXPECTED_ARCHIVE_SHA256"
            echo "actual=$actual"
            exit 21
          fi

          mkdir -p "$stage"
          export DEADWORLDS_BOOTSTRAP_ARCHIVE="$archive"
          export DEADWORLDS_BOOTSTRAP_STAGE="$stage"

          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import os, zipfile

          archive = Path(os.environ["DEADWORLDS_BOOTSTRAP_ARCHIVE"])
          stage = Path(os.environ["DEADWORLDS_BOOTSTRAP_STAGE"]).resolve()

          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = PurePosixPath(info.filename)
                  if name.is_absolute() or ".." in name.parts:
                      raise SystemExit(f"Unsafe embedded archive path: {info.filename}")
                  target = (stage / Path(*name.parts)).resolve()
                  if stage not in target.parents and target != stage:
                      raise SystemExit(f"Archive path escaped staging directory: {info.filename}")
              z.extractall(stage)
          PY

          (
            cd "$stage"
            sha256sum --check GITHUB_REPO_MANIFEST_SHA256.txt
          )

          test -f "$stage/.github/workflows/deadworlds-compute.yml"
          test -f "$stage/scripts/claim_bundle.py"
          test -f "$stage/PRODUCTION_CONSTRAINTS.txt"
          test -f "$stage/pyproject.toml"

          echo "Embedded Deadworlds repository verified."

      - name: Replace bootstrap with audited repository tree
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/deadworlds-repo"

          # Preserve .git only. The verified payload deliberately excludes
          # this bootstrap workflow, so the finished repo contains only the
          # real Deadworlds runner tree.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$stage/." .

          if [[ -e ".github/workflows/bootstrap-deadworlds.yml" ]]; then
            echo "::error::Bootstrap workflow unexpectedly survived replacement."
            exit 22
          fi

          git add --all
          if git diff --cached --quiet; then
            echo "::error::Bootstrap produced no repository changes."
            exit 23
          fi

      - name: Commit reconstructed repository
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Deadworlds Bootstrap"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Bootstrap Deadworlds science runner"
          git push origin HEAD:main

          echo "Deadworlds repository bootstrap complete."
          echo "The bootstrap workflow removed itself."
          echo "The real compute workflow is now .github/workflows/deadworlds-compute.yml"
