name: Deadworlds one-shot Module 3 renderer v0.5 (fixed)
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: deadworlds-module3-renderer-v05
  cancel-in-progress: false
jobs:
  patch-test-commit:
    name: Add Module 3 adapters, validate, test, and commit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - name: Check out main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: main
        fetch-depth: 0
    - name: Set up Python 3.13
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: figure_renderer/RENDERER_CONSTRAINTS.txt
    - name: Verify clean audited v0.4 starting state
      shell: bash
      run: "set -euo pipefail\ntest \"$(git branch --show-current)\" = \"main\"\ngit diff --exit-code\ngit diff --cached --exit-code\npython - <<'PY'\nfrom pathlib import Path\nchecks = {\n    \"figure_renderer/pyproject.toml\": 'version = \"0.4.0\"',\n    \"figure_renderer/deadworlds_figures/__init__.py\": '__version__ = \"0.4.0\"',\n    \"figure_renderer/scripts/run_render_bundle.py\": 'EXPECTED_RENDERER = \"deadworlds-figure-renderer-v0.4.0\"',\n    \"figure_renderer/README.md\": \"# Deadworlds Figure Renderer v0.4.0\",\n}\nfor path, marker in checks.items():\n    text = Path(path).read_text(encoding=\"utf-8\")\n    if marker not in text:\n        raise SystemExit(f\"Unexpected starting state in {path}; missing {marker!r}\")\nif '\"m03_capture_efficiency_sensitivity\"' in Path(\"figure_renderer/deadworlds_figures/adapters.py\").read_text(encoding=\"utf-8\"):\n    raise SystemExit(\"Module 3 renderer support already appears present.\")\nprint(\"Starting state is audited renderer v0.4.\")\nPY"
    - name: Apply Module 3 renderer v0.5 patch
      shell: bash
      env:
        DEADWORLDS_PATCH_B64: 
      run: 'set -euo pipefail

        python - <<''PY''

        import base64, os

        from pathlib import Path

        Path("/tmp/deadworlds_m03_renderer_patch.py").write_bytes(base64.b64decode(os.environ["DEADWORLDS_PATCH_B64"]))

        PY

        python /tmp/deadworlds_m03_renderer_patch.py

        rm -f /tmp/deadworlds_m03_renderer_patch.py'
    - name: Verify patch scope and semantic markers
      shell: bash
      run: "set -euo pipefail\ngit diff --check\npython - <<'PY'\nimport ast, subprocess\nfrom pathlib import Path\nallowed = {\n    \"figure_renderer/README.md\",\n    \"figure_renderer/RENDERER_CONSTRAINTS.txt\",\n    \"figure_renderer/pyproject.toml\",\n    \"figure_renderer/deadworlds_figures/__init__.py\",\n    \"figure_renderer/deadworlds_figures/adapters.py\",\n    \"figure_renderer/deadworlds_figures/validate.py\",\n    \"figure_renderer/scripts/run_render_bundle.py\",\n    \"figure_renderer/tests/test_renderer.py\",\n}\nchanged = {x for x in subprocess.check_output([\"git\",\"diff\",\"--name-only\"], text=True).splitlines() if x}\nif changed != allowed:\n    raise SystemExit(f\"Patch scope mismatch: {sorted(changed)}\")\nsource = Path(\"figure_renderer/deadworlds_figures/adapters.py\").read_text(encoding=\"utf-8\")\ntree = ast.parse(source)\nregistry = None\nfor node in tree.body:\n    if isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name) and node.target.id == \"_ADAPTERS\":\n        registry = {k.value for k in node.value.keys if isinstance(k, ast.Constant) and isinstance(k.value, str)}\n        break\nrequired = {\"m03_capture_efficiency_sensitivity\",\"m03_trophic_transfer_sensitivity\",\"m03_energy_channel_identifiability\"}\nif registry is None or not required <= registry or len(registry) != 20:\n    raise SystemExit(f\"Expected 20 adapters with M3; got {0 if registry is None else len(registry)}\")\nfor path, marker in {\n    \"figure_renderer/pyproject.toml\": 'version = \"0.5.0\"',\n    \"figure_renderer/deadworlds_figures/__init__.py\": '__version__ = \"0.5.0\"',\n    \"figure_renderer/scripts/run_render_bundle.py\": 'EXPECTED_RENDERER = \"deadworlds-figure-renderer-v0.5.0\"',\n    \"figure_renderer/README.md\": \"currently supports 20 hosted recipes\",\n}.items():\n    if marker not in Path(path).read_text(encoding=\"utf-8\"):\n        raise SystemExit(f\"Missing marker {marker!r} in {path}\")\nprint(\"Patch scope and Module 3 v0.5 registry verified.\")\nPY"
    - name: Install pinned renderer environment
      shell: bash
      working-directory: figure_renderer
      run: 'set -euo pipefail

        python -m pip install --upgrade pip

        python -m pip install -c RENDERER_CONSTRAINTS.txt ''.[dev]'''
    - name: Run focused Module 3 tests
      shell: bash
      working-directory: figure_renderer
      run: 'set -euo pipefail

        python -m pytest -q tests/test_renderer.py -k module3'
    - name: Run complete renderer regression suite
      shell: bash
      working-directory: figure_renderer
      run: 'set -euo pipefail

        python -m pytest -q tests'
    - name: Commit tested v0.5 patch and remove one-shot workflow
      shell: bash
      run: 'set -euo pipefail

        WORKFLOW=".github/workflows/deadworlds-module3-renderer-v05.yml"

        test -f "$WORKFLOW"

        rm "$WORKFLOW"

        git diff --check

        git config user.name "deadworlds-maintenance[bot]"

        git config user.email "91988331+pseudo6626@users.noreply.github.com"

        git add   figure_renderer/README.md   figure_renderer/RENDERER_CONSTRAINTS.txt   figure_renderer/pyproject.toml   figure_renderer/deadworlds_figures/__init__.py   figure_renderer/deadworlds_figures/adapters.py   figure_renderer/deadworlds_figures/validate.py   figure_renderer/scripts/run_render_bundle.py   figure_renderer/tests/test_renderer.py   "$WORKFLOW"

        git commit -m "Add Module 3 ecological energy renderer"

        git push origin HEAD:main'
