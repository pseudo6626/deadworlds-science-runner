name: Deadworlds runner regression tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "deadworlds_compute/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "PRODUCTION_CONSTRAINTS.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: PRODUCTION_CONSTRAINTS.txt

      - name: Install runner and tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -c PRODUCTION_CONSTRAINTS.txt '.[dev]'

      - name: Run regression suite
        run: python -m pytest -q tests
