name: Deadworlds one-shot renderer v0.5 hosted M3 E2E
'on':
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: deadworlds-render-v05-hosted-m3-e2e
  cancel-in-progress: false
jobs:
  upgrade-dispatch-verify:
    name: Upgrade permanent renderer workflow and verify hosted M3
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Check out main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: main
        fetch-depth: 0
    - name: Verify renderer v0.5 repository baseline
      shell: bash
      run: "set -euo pipefail\ngit diff --exit-code\ngit diff --cached --exit-code\npython - <<'PY'\nfrom pathlib import Path\nchecks = {\n    \"figure_renderer/pyproject.toml\": 'version = \"0.5.0\"',\n    \"figure_renderer/deadworlds_figures/schema.py\": 'RENDERER_VERSION = \"deadworlds-figure-renderer-v0.5.0\"',\n    \"figure_renderer/scripts/run_render_bundle.py\": 'EXPECTED_RENDERER = \"deadworlds-figure-renderer-v0.5.0\"',\n}\nfor path, marker in checks.items():\n    if marker not in Path(path).read_text(encoding=\"utf-8\"):\n        raise SystemExit(f\"Missing v0.5 baseline marker in {path}: {marker}\")\nwf = Path(\".github/workflows/deadworlds-render-figure.yml\").read_text(encoding=\"utf-8\")\nif wf.count('\"deadworlds-figure-renderer\": \"0.4.0\"') != 2:\n    raise SystemExit(\"Permanent render workflow is not in the expected pre-upgrade v0.4 runtime state\")\nif wf.count(\"`deadworlds-figure-renderer-v0.4.0`\") != 1:\n    raise SystemExit(\"Permanent render workflow summary is not in expected pre-upgrade state\")\nprint(\"Renderer v0.5 code baseline confirmed; permanent hosted workflow still needs its v0.5 upgrade.\")\nPY\n"
    - name: Patch permanent hosted renderer workflow
      shell: bash
      env:
        PATCH_B64: 
      run: 'set -euo pipefail

        python - <<''PY''

        import base64, os

        from pathlib import Path

        p = Path(os.environ["RUNNER_TEMP"]) / "patch_permanent_render_workflow.py"

        p.write_bytes(base64.b64decode(os.environ["PATCH_B64"]))

        PY

        python "$RUNNER_TEMP/patch_permanent_render_workflow.py"

        rm -f "$RUNNER_TEMP/patch_permanent_render_workflow.py"

        '
    - name: Verify permanent workflow patch
      shell: bash
      run: "set -euo pipefail\ngit diff --check\npython - <<'PY'\nfrom pathlib import Path\np = Path(\".github/workflows/deadworlds-render-figure.yml\")\ntext = p.read_text(encoding=\"utf-8\")\nrequired = [\n    \"workflow_dispatch:\",\n    '\"deadworlds-figure-renderer\": \"0.5.0\"',\n    \"github.event_name == 'workflow_dispatch'\",\n    \"Clean sandbox artifact after manual E2E\",\n    \"X-Deadworlds-Capability: $token\",\n    \"`deadworlds-figure-renderer-v0.5.0`\",\n]\nfor marker in required:\n    if marker not in text:\n        raise SystemExit(f\"Missing expected permanent-workflow marker: {marker}\")\nif \"deadworlds-figure-renderer-v0.4.0\" in text:\n    raise SystemExit(\"Stale v0.4 renderer label remains in permanent render workflow\")\nif '\"deadworlds-figure-renderer\": \"0.4.0\"' in text:\n    raise SystemExit(\"Stale v0.4 runtime check remains in permanent render workflow\")\nprint(\"Permanent render workflow patch markers verified.\")\nPY\nchanged=\"$(git diff --name-only)\"\ntest \"$changed\" = \".github/workflows/deadworlds-render-figure.yml\"\n"
    - name: Commit permanent v0.5 hosted workflow
      id: commit
      shell: bash
      run: 'set -euo pipefail

        git config user.name "deadworlds-maintenance[bot]"

        git config user.email "91988331+pseudo6626@users.noreply.github.com"

        git add .github/workflows/deadworlds-render-figure.yml

        git commit -m "Enable renderer v0.5 hosted sandbox validation"

        git push origin HEAD:main

        echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

        '
    - name: Dispatch and verify hosted Module 3 E2E
      id: hosted
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\n\nTARGET_SHA=\"${{ steps.commit.outputs.target_sha }}\"\nJOB_ID=\"9392ff33-0dbc-4345-b226-f2d893c01836\"\nAPI=\"https://api.github.com/repos/${GITHUB_REPOSITORY}\"\nAUTH=\"Authorization: Bearer ${GITHUB_TOKEN}\"\n\nhttp=\"$(curl --silent --show-error -o \"$RUNNER_TEMP/dispatch-response.txt\" -w '%{http_code}' \\\n  -X POST \\\n  -H \"$AUTH\" \\\n  -H \"Accept: application/vnd.github+json\" \\\n  -H \"X-GitHub-Api-Version: 2022-11-28\" \\\n  \"$API/actions/workflows/deadworlds-render-figure.yml/dispatches\" \\\n  -d '{\"ref\":\"main\",\"inputs\":{\"render_job_id\":\"9392ff33-0dbc-4345-b226-f2d893c01836\"}}')\"\n\nif [[ \"$http\" != \"204\" ]]; then\n  echo \"workflow_dispatch failed with HTTP $http\"\n  cat \"$RUNNER_TEMP/dispatch-response.txt\"\n  exit 1\nfi\n\necho \"Dispatched hosted Module 3 render job $JOB_ID at commit $TARGET_SHA\"\n\nrun_id=\"\"\nfor _ in $(seq 1 40); do\n  response=\"$(curl --fail-with-body --silent --show-error \\\n    -H \"$AUTH\" \\\n    -H \"Accept: application/vnd.github+json\" \\\n    -H \"X-GitHub-Api-Version: 2022-11-28\" \\\n    \"$API/actions/workflows/deadworlds-render-figure.yml/runs?event=workflow_dispatch&branch=main&per_page=20\")\"\n  run_id=\"$(python - \"$TARGET_SHA\" \"$response\" <<'PY'\nimport json, sys\nsha, raw = sys.argv[1], sys.argv[2]\ndata = json.loads(raw)\nfor run in data.get(\"workflow_runs\", []):\n    if run.get(\"head_sha\") == sha and run.get(\"event\") == \"workflow_dispatch\":\n        print(run[\"id\"])\n        break\nPY\n)\"\n  [[ -n \"$run_id\" ]] && break\n  sleep 3\ndone\n\nif [[ -z \"$run_id\" ]]; then\n  echo \"Could not locate the hosted workflow_dispatch run.\"\n  exit 1\nfi\n\necho \"Hosted run id: $run_id\"\n\nfor _ in $(seq 1 120); do\n  response=\"$(curl --fail-with-body --silent --show-error \\\n    -H \"$AUTH\" \\\n    -H \"Accept: application/vnd.github+json\" \\\n    -H \"X-GitHub-Api-Version: 2022-11-28\" \\\n    \"$API/actions/runs/$run_id\")\"\n  read -r status conclusion < <(python - \"$response\" <<'PY'\nimport json, sys\nr = json.loads(sys.argv[1])\nprint(r.get(\"status\") or \"\", r.get(\"conclusion\") or \"\")\nPY\n)\n  if [[ \"$status\" == \"completed\" ]]; then\n    if [[ \"$conclusion\" != \"success\" ]]; then\n      echo \"Hosted Module 3 E2E failed: run=$run_id conclusion=$conclusion\"\n      exit 1\n    fi\n    echo \"Hosted Module 3 E2E succeeded: run=$run_id\"\n    echo \"hosted_run_id=$run_id\" >> \"$GITHUB_OUTPUT\"\n    exit 0\n  fi\n  sleep 5\ndone\n\necho \"Timed out waiting for hosted Module 3 E2E run $run_id\"\nexit 1\n"
    - name: Remove one-shot helper after successful E2E
      shell: bash
      run: 'set -euo pipefail

        SELF=".github/workflows/deadworlds-render-v05-hosted-e2e.yml"

        test -f "$SELF"

        rm "$SELF"

        git add "$SELF"

        git commit -m "Remove renderer v0.5 hosted E2E helper"

        git push origin HEAD:main

        '
